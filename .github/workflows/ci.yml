name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + Testcontainers IT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Surefire runs *Test (unit + @WebMvcTest); failsafe runs *IT against a real
      # PostgreSQL container - Docker is available on GitHub-hosted runners.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  docker:
    name: Docker images + compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Images are built and loaded locally only - nothing is pushed to a registry.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: taskflow-backend:local
          load: true
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          tags: taskflow-frontend:local
          load: true
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8081/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/api/projects | jq -e '.content | length >= 1'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
